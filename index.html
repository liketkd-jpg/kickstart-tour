/* KICKSTART UP Tour — 깊은 남색 바탕에 빨강 한 점, 넓은 여백, 숫자는 기하학 글꼴. 아래 고정 메뉴의 휴대폰 앱 구조 */
:root{
  --bg:#F4F6FB; --card:#FFFFFF; --fg:#0A1230; --muted:#596277; --line:#E5E9F2;
  --hero:#0B1A4A; --hero-2:#13286B; --hero-muted:#B9C3E6;
  --soft:#EDF1FB; --soft-ink:#1B2D78; --red:#E0312B; --red-soft:#FDEDEC; --red-ink:#C4231D; --warn:#A8520A; --ok:#1B7A4B;
  --field:#FFFFFF; --field-line:#D7DCE8; --scrim:rgba(6,12,32,.5);
  --shadow:0 1px 2px rgba(10,18,48,.04),0 10px 28px rgba(10,18,48,.07);
  --nav:rgba(255,255,255,.88);
  --f-body:'Pretendard Variable','Pretendard','Noto Sans KR',system-ui,-apple-system,sans-serif;
  --f-num:'Space Grotesk','Pretendard Variable','Noto Sans KR',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#070C1C; --card:#111934; --fg:#EEF1F8; --muted:#9AA4BD; --line:#222C4A;
  --hero:#13286B; --hero-2:#1B3384; --hero-muted:#C3CCEB;
  --soft:#1A2550; --soft-ink:#BFCBFF; --red:#E0312B; --red-soft:#3A1416; --red-ink:#FF8A84; --warn:#F2A65A; --ok:#5FD39A;
  --field:#0C1430; --field-line:#2C3760; --scrim:rgba(0,0,0,.62);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35); --nav:rgba(13,20,44,.9); color-scheme:dark }}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;word-break:keep-all;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(110px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.app{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button,a.btn,label.btn{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
[hidden]{display:none!important}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px}
.brand{font-family:var(--f-num);font-weight:700;font-size:13px;letter-spacing:.14em;display:flex;align-items:center;gap:8px}
.brand::before{content:"";width:22px;height:22px;border-radius:7px;background:var(--hero);box-shadow:inset 0 -5px 0 var(--red)}
.brand b{color:var(--red-ink)}
.linkbtn{background:none;border:0;color:var(--soft-ink);font-size:13px;font-weight:700;min-height:44px;padding:0 6px}
h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.035em;line-height:1.2;text-wrap:balance}
h2{margin:0;font-size:16px;font-weight:700;letter-spacing:-.02em}
.sub{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.muted{color:var(--muted);font-size:12.5px}
.stack{display:flex;flex-direction:column;gap:14px}
.hero{background:var(--hero);color:#fff;border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;border:28px solid rgba(255,255,255,.05);pointer-events:none}
.hero .row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--hero-muted);align-items:center;font-weight:600}
.hero .big{font-family:var(--f-num);font-size:52px;font-weight:700;line-height:1;letter-spacing:-.04em}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.actions .wide{grid-column:1/-1}
.btn{min-height:52px;border-radius:16px;border:0;padding:0 18px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;text-decoration:none;transition:transform .08s ease,filter .15s ease}
.btn:active{transform:scale(.98)}
.btn-red{background:var(--red);color:#fff;box-shadow:0 6px 16px rgba(224,49,43,.25)}
.btn-navy{background:var(--hero);color:#fff}
.btn-line{background:var(--card);color:var(--soft-ink);border:1.5px solid var(--soft-ink)}
.btn-ghost{background:var(--card);color:var(--fg);border:1px solid var(--field-line)}
.btn-big{min-height:76px;font-size:21px;border-radius:20px}
.btn[disabled]{opacity:.5;cursor:default;box-shadow:none}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted);font-weight:600;min-width:0}
.in{width:100%;min-height:50px;border:1px solid var(--field-line);border-radius:14px;background:var(--field);padding:0 14px;font-size:16px;color:var(--fg);min-width:0;transition:border-color .15s,box-shadow .15s}
.in:focus{outline:none;border-color:var(--soft-ink);box-shadow:0 0 0 4px var(--soft)}
textarea.in{padding:12px 14px;min-height:84px;resize:vertical;line-height:1.6}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2px;
  background:var(--nav);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tab{min-height:58px;border:0;border-radius:14px;background:none;font-weight:600;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:var(--fg);font-weight:800}
.tab[aria-selected="true"] .ico{background:var(--soft);color:var(--soft-ink)}
.tab .ico{display:flex;align-items:center;justify-content:center;width:52px;height:30px;border-radius:15px;transition:background .15s}
.badge{position:absolute;top:4px;left:calc(50% + 8px);min-width:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:800;line-height:18px;font-family:var(--f-num)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:40px;padding:0 16px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg);font-weight:800}
.list{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:4px 18px;box-shadow:var(--shadow)}
.row-item{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.row-item:last-child{border-bottom:0}
.row-item input[type=checkbox]{width:24px;height:24px;margin:2px 0 0;accent-color:var(--red);flex-shrink:0}
.row-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;background:none;border:0;text-align:left;padding:0;color:var(--fg)}
.ttl{font-weight:700;font-size:15.5px;overflow-wrap:anywhere;letter-spacing:-.02em}
.done .ttl{text-decoration:line-through;color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:8px;background:var(--soft);color:var(--soft-ink);letter-spacing:0}
.tag.show{background:var(--red-soft);color:var(--red-ink)}
.pill{font-size:12px;font-weight:700;padding:5px 11px;border-radius:12px;background:var(--soft);color:var(--soft-ink)}
.pill.warn{background:var(--red-soft);color:var(--warn)}
.maplink{flex-shrink:0;min-height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line);display:inline-flex;align-items:center;font-size:12.5px;font-weight:700;color:var(--soft-ink);text-decoration:none;background:var(--card)}
.ncard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.ncard.new{border-color:transparent;box-shadow:0 0 0 2px var(--red),var(--shadow)}
.ntime{font-family:var(--f-num);font-size:46px;font-weight:700;line-height:1;letter-spacing:-.04em}
.nplace{font-size:19px;font-weight:800;overflow-wrap:anywhere;letter-spacing:-.03em}
.nmsg{font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65}
.who{display:flex;flex-wrap:wrap;gap:6px}
.who span{font-size:12px;padding:5px 10px;border-radius:10px;background:var(--bg);font-weight:600}
.who .no{color:var(--warn);font-weight:800}
.grid-names{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.namebtn{min-height:56px;border-radius:14px;border:1.5px dashed var(--warn);background:var(--card);color:var(--warn);font-weight:800;font-size:14px;padding:4px;overflow-wrap:anywhere}
.namebtn[aria-pressed="true"]{border:1.5px solid transparent;background:var(--soft);color:var(--soft-ink)}
.empty{background:var(--card);border:1px dashed var(--field-line);border-radius:22px;padding:32px 22px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.empty strong{color:var(--fg);font-size:16px}
.banner{background:var(--red-soft);border-radius:16px;padding:12px 14px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:600}
.banner span{flex:1;min-width:200px}
.code{font-family:var(--f-num);font-size:44px;font-weight:700;letter-spacing:.16em}
.qr{width:200px;height:200px;image-rendering:pixelated;background:#fff;border-radius:16px;padding:10px;align-self:center;box-shadow:var(--shadow)}
.sheet-wrap{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.sheet{background:var(--bg);width:100%;max-width:620px;max-height:calc(100% - env(safe-area-inset-top,0px) - 24px);overflow-y:auto;border-radius:26px 26px 0 0;
  padding:12px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet::before{content:"";width:40px;height:5px;border-radius:3px;background:var(--field-line);align-self:center}
.sheet-top{display:flex;justify-content:space-between;align-items:center}
.x{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--card);font-size:20px;line-height:1}
.catsel{display:flex;gap:6px;flex-wrap:wrap}
.catsel button{height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:13px;font-weight:600}
.catsel button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg);font-weight:800}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:16px;font-size:14px;font-weight:700;z-index:30;max-width:calc(100% - 36px);text-align:center;box-shadow:var(--shadow)}
.title-block{display:flex;flex-direction:column;gap:4px}
.landing-hero{background:var(--hero);color:#fff;border-radius:28px;padding:30px 24px 26px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.landing-hero::after{content:"";position:absolute;right:-60px;bottom:-60px;width:220px;height:220px;border-radius:50%;border:36px solid rgba(255,255,255,.05)}
.landing-hero .eyebrow{font-family:var(--f-num);font-size:12px;letter-spacing:.2em;color:var(--hero-muted);font-weight:700}
.landing-hero h1{color:#fff;font-size:32px}
.landing-hero .en{font-family:var(--f-num);font-size:15px;color:#fff;opacity:.85;font-weight:500;letter-spacing:-.01em}
.landing-hero .bar{width:44px;height:4px;border-radius:2px;background:var(--red)}
.feats{display:grid;gap:10px}
.feat{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.feat .ico{width:42px;height:42px;border-radius:13px;background:var(--soft);color:var(--soft-ink);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.feat svg{width:22px;height:22px}
.feat b{display:block;font-size:15px;letter-spacing:-.02em}
.feat span{font-size:13px;color:var(--muted)}
.panel .list{border:0;box-shadow:none;padding:0;background:none}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>

const $ = id => document.getElementById(id);
function h(tag, props, ...kids){
  const el=document.createElement(tag);
  for(const [k,v] of Object.entries(props||{})){
    if(v==null||v===false) continue;
    if(k==='class') el.className=v; else if(k==='text') el.textContent=v;
    else if(k.startsWith('on')) el.addEventListener(k.slice(2),v);
    else el.setAttribute(k,v===true?'':String(v));
  }
  for(const c of kids.flat()){ if(c==null||c===false) continue; el.append(c.nodeType?c:document.createTextNode(String(c))); }
  return el;
}
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const isDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'');
const addDays=(s,n)=>{ const d=new Date(s+'T00:00:00'); d.setDate(d.getDate()+n); return ymd(d); };
const WD=['일','월','화','수','목','금','토'];
const dayLabel=s=>{ const d=new Date(s+'T00:00:00'); if(isNaN(d)) return s||''; return LANG==='en'? d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}) : (d.getMonth()+1)+'월 '+d.getDate()+'일 ('+WD[d.getDay()]+')'; };
const hm=ts=>{ if(!ts) return ''; const d=new Date(ts); return pad(d.getHours())+':'+pad(d.getMinutes()); };
const ago=ts=>{ if(!ts) return ''; const m=Math.round((Date.now()-new Date(ts))/60000); return m<1?T('방금'):m<60?m+T('분 전'):Math.round(m/60)+T('시간 전'); };
const isUrl=s=>/^https:\/\/\S+$/i.test(String(s||'').trim());

  if(/wrong_code/.test(m)) return T('초대 번호가 맞지 않습니다. 다시 확인해 주세요');

  if(/bad_token/.test(m)) return T('원정에서 빠졌습니다. 다시 참가해 주세요');
  if(/Invalid login credentials/i.test(m)) return T('이메일 또는 비밀번호가 맞지 않습니다');
  if(/already registered/i.test(m)) return T('이미 가입된 이메일입니다. 로그인해 주세요');
  if(/Password should be/i.test(m)) return T('비밀번호는 6자 이상으로 넣어 주세요');
  if(/Failed to fetch|NetworkError|network/i.test(m)) return T('인터넷 연결을 확인해 주세요');
  return T('잠시 문제가 생겼습니다. 다시 시도해 주세요'); }

/* ---------- 원정 열기·데이터 ---------- */
async function openTour(t,tab){
  S.tour=t; store.set('tourId',t.id);
  S.tab = tab || S.tab || 'notices';
  S.knownNotices=null; S.day=null;
  await loadAll(); subscribe(); render();
}
// 지도자 화면: 표 이름 ↔ 화면 상태 이름
const TABLES={members:'tour_members',stops:'tour_stops',notices:'tour_notices',acks:'tour_acks',checks:'tour_checks',check_marks:'tour_check_marks',guides:'tour_guides',journal:'tour_journal',cues:'tour_cues',subs:'tour_push_subs'};
async function loadTable(tb){
  const id=S.tour.id; let q=S.sb.from(TABLES[tb]).select('*').eq('tour_id',id);
  if(tb==='notices'||tb==='checks') q=q.order('created_at',{ascending:false}).limit(60);
  if(tb==='stops') q=q.order('date').order('time');
  const r=await q;
  if(r.error){ if(tb==='guides'||tb==='journal'||tb==='cues'||tb==='subs'){ S[tb]=[]; return; } throw r.error; }
  const key = tb==='check_marks'?'marks':tb; S[key]=r.data||[];
}
// 단원 화면: 열쇠(token) 하나로 내 원정 내용 한 번에 받기
async function loadStudent(){
  const r=await S.sb.rpc('tour_student_state',{p_token:S.token});
  if(r.error) throw r.error;
  const d=r.data; S.tour=d.tour; S.me=d.me; S.members=[d.me];
  S.stops=d.stops||[]; S.notices=d.notices||[]; S.acks=d.acks||[]; S.checks=d.checks||[]; S.marks=d.marks||[]; S.guides=d.guides||[]; S.journal=d.journal||[]; S.cues=d.cues||[]; S.roommates=d.roommates||[];
}
async function loadAll(){
  const ck='cache:'+(S.anon?'student':S.tour.id);
  try{
    if(S.anon) await loadStudent(); else await Promise.all(Object.keys(TABLES).map(loadTable));
    S.offline=false; $('netBar').hidden=true;
    store.set(ck, JSON.stringify({t:Date.now(),tour:S.tour,me:S.me,members:S.members,stops:S.stops,notices:S.notices,acks:S.acks,checks:S.checks,marks:S.marks,guides:S.guides,journal:S.journal,cues:S.cues,roommates:S.roommates}));
  }catch(err){
    if(/bad_token/.test(String(err&&err.message))){ store.set('tourToken',null); S.token=null; S.anon=false; S.tour=null; toast(T('원정에서 빠졌습니다. 다시 참가해 주세요')); screenJoin(''); throw err; }
    const c=store.get(ck);
    if(c){ try{ const d=JSON.parse(c); Object.assign(S,{tour:d.tour||S.tour,members:d.members,stops:d.stops,notices:d.notices,acks:d.acks,checks:d.checks,marks:d.marks,guides:d.guides||[],journal:d.journal||[],cues:d.cues||[],roommates:d.roommates||[]}); if(S.anon) S.me=d.me; }catch(e){} }
    else if(!S.tour) throw err;
    S.offline=true; const nb=$('netBar'); nb.replaceChildren(h('span',{text:T('인터넷이 끊겨 마지막으로 받은 내용을 보여 줍니다. 연결되면 저절로 새로 고칩니다.')})); nb.hidden=false;
  }
}
let reloadT={};
function reloadSoon(tb){
  clearTimeout(reloadT[tb]);
  reloadT[tb]=setTimeout(async()=>{ try{ if(S.anon) await loadStudent(); else await loadTable(tb); if(tb==='notices') notifyNew(); render(); }catch(e){} },250);
}
function subscribe(){
  if(S.channel){ S.sb.removeChannel(S.channel); S.channel=null; }
  S.knownNotices=new Set(S.notices.map(n=>n.id));
  if(S.anon) return; // 단원은 15초마다 새로 받습니다
  const id=S.tour.id; let ch=S.sb.channel('tour-'+id);
  Object.entries(TABLES).forEach(([key,tb])=>{ ch=ch.on('postgres_changes',{event:'*',schema:'public',table:tb,filter:'tour_id=eq.'+id},()=>reloadSoon(key)); });
  S.channel=ch.subscribe();
}
function notifyNew(){
  const ids=new Set(S.notices.map(n=>n.id));
  if(S.knownNotices && [...ids].some(x=>!S.knownNotices.has(x))){
    toast(T('새 공지가 왔습니다'));
    if(S.anon){ S.tab='notices'; try{ navigator.vibrate&&navigator.vibrate([200,100,200]); }catch(e){} }
  }
  S.knownNotices=ids;
  const lg=liveGuide();
  if(S.knownLive!==null && lg && lg.id+lg.live_at!==S.knownLive && S.anon){ toast(T('지금 해설: ')+lg.title); S.tab='guide'; try{ navigator.vibrate&&navigator.vibrate(200); }catch(e){} }
  S.knownLive = lg ? lg.id+lg.live_at : '';
}
const refresh=()=>{ if(S.tour) loadAll().then(()=>{ notifyNew(); render(); }).catch(()=>{}); };
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') refresh(); });
window.addEventListener('online',refresh);
let tick=0;
setInterval(()=>{ if(!S.tour||document.visibilityState!=='visible') return; tick++; if(S.anon||tick%4===0) refresh(); },15000);

/* ---------- 원정 화면 ---------- */
function tourDays(){
  const set=new Set(), st=S.tour.start_date, en=S.tour.end_date;
  if(isDate(st)&&isDate(en)&&en>=st){ for(let i=0;i<90;i++){ const d=addDays(st,i); if(d>en) break; set.add(d); } } else if(isDate(st)) set.add(st);
  S.stops.forEach(s=>isDate(s.date)&&set.add(s.date));
  return [...set].sort();
}
const dayNo=(d,days)=>{ const base=(isDate(S.tour.start_date)&&S.tour.start_date<=(days[0]||d))?S.tour.start_date:(days[0]||d); return Math.round((new Date(d+'T00:00:00')-new Date(base+'T00:00:00'))/864e5)+1; };
const L=()=>!S.anon;
const seenBy=nid=>new Set(S.acks.filter(a=>a.notice_id===nid).map(a=>a.member_id));
const openCheck=()=>S.checks.find(c=>!c.closed)||null;
const liveGuide=()=>S.guides.filter(g=>g.live_at&&Date.now()-new Date(g.live_at)<15*60000).sort((a,b)=>new Date(b.live_at)-new Date(a.live_at))[0]||null;

  const tabs = L()? [['notices',T('공지')],['schedule',T('일정')],['guide',T('가이드')],['check',T('점검')],['members',LANG==='en'?'Members':'단원']] : [['notices',T('공지')],['schedule',T('일정')],['guide',T('가이드')],['check',T('점검')],['me',T('내 정보')]];
  if(!tabs.some(t=>t[0]===S.tab)) S.tab='notices';
  const unseen = S.anon ? S.notices.filter(n=>!S.acks.some(a=>a.notice_id===n.id&&a.member_id===S.me.id)).length : 0;

  const days=tourDays(), di=days.indexOf(today());
  const eyebrow = (L()? T('LEADER · 초대 번호 ')+S.tour.code : S.me.name+' · '+T(S.me.grp)) + (di>=0? ' · '+dn(di+1) : '');

function closeTour(){ if(S.channel){ S.sb.removeChannel(S.channel); S.channel=null; } S.tour=null; store.set('tourId',null); }
async function leaveTour(){ closeTour(); store.set('tourToken',null); S.token=null; S.anon=false; S.me=null; history.replaceState(null,'',location.pathname); screenJoin(''); }

function viewSchedule(){

const TTS={ playing:null, queue:[] };
function koVoice(){
  if(!('speechSynthesis' in window)) return null;
  const vs=speechSynthesis.getVoices().filter(v=>new RegExp('^'+(LANG==='en'?'en':'ko'),'i').test(v.lang));
  return vs.find(v=>/natural|google|yuna|sunhi|heami|online/i.test(v.name))||vs[0]||null;
}
if('speechSynthesis' in window) speechSynthesis.onvoiceschanged=()=>{};
function stopSpeak(){ try{ speechSynthesis.cancel(); }catch(e){} TTS.playing=null; TTS.queue=[]; }
function speak(g){
  if(!('speechSynthesis' in window)){ toast(T('이 휴대폰은 읽어 주기를 지원하지 않습니다')); return; }
  stopSpeak();
  const parts=String(g.script||'').replace(/\s+/g,' ').split(/(?<=[.!?。…])\s+|(?<=다\.)\s*/).map(x=>x.trim()).filter(Boolean);
  const chunks=[]; let cur='';
  parts.forEach(p=>{ if((cur+' '+p).length>180){ if(cur) chunks.push(cur); cur=p; } else cur=cur?cur+' '+p:p; }); if(cur) chunks.push(cur);
  if(!chunks.length){ toast(T('해설 글이 비어 있습니다')); return; }
  TTS.playing=g.id; TTS.queue=chunks.slice();
  const v=koVoice();
  const next=()=>{
    if(TTS.playing!==g.id) return;
    const t=TTS.queue.shift(); if(!t){ TTS.playing=null; render(); return; }
    const u=new SpeechSynthesisUtterance(t); u.lang=LANG==='en'?'en-US':'ko-KR'; if(v) u.voice=v; u.rate=S.rate; u.onend=next; u.onerror=()=>{ TTS.playing=null; render(); };
    speechSynthesis.speak(u);
  };
  next(); render();
}
async function wikiIntro(q){
  const base='https://'+(LANG==='en'?'en':'ko')+'.wikipedia.org/w/api.php?format=json&origin=*&';
  const s=await fetch(base+'action=query&list=search&srlimit=1&srsearch='+encodeURIComponent(q)).then(r=>r.json());
  const hit=s&&s.query&&s.query.search&&s.query.search[0]; if(!hit) return null;
  const e=await fetch(base+'action=query&prop=extracts&exintro=1&explaintext=1&redirects=1&titles='+encodeURIComponent(hit.title)).then(r=>r.json());
  const pg=Object.values((e&&e.query&&e.query.pages)||{})[0]; if(!pg||!pg.extract) return null;
  return {title:pg.title, text:pg.extract.replace(/\([^)]*\)/g,'').replace(/\s+/g,' ').trim(), url:'https://'+(LANG==='en'?'en':'ko')+'.wikipedia.org/wiki/'+encodeURIComponent(pg.title.replace(/ /g,'_'))};
}

      : h('div',{class:'empty'},h('strong',{text:T('순서표가 아직 없습니다')}),h('span',{text:L()?T('아래에서 순서를 하나씩 넣어 주세요.'):T('지도자가 순서표를 만들면 여기에 보입니다.')})));
    if(L()){
      const f={title:h('input',{class:'in',placeholder:T('예: 오프닝 품새')}),music:h('input',{class:'in',placeholder:T('음악 파일 이름')}),who:h('input',{class:'in',placeholder:T('출연 단원')}),props:h('input',{class:'in',placeholder:T('격파 송판 20장 등')}),duration:h('input',{class:'in',placeholder:T('예: 2분 30초')})};

    const sa=a.seq, sb=b.seq===a.seq?a.seq+dir:b.seq;

/* ---------- 현지어 배우기: 레슨 단계 학습 (퀴즈 + 발음 시험 통과 → 다음 레슨) ---------- */
const PH=window.TOUR_PHRASES||{langs:{},cats:[],list:[],lessons:[]};
const PHMAP=Object.fromEntries(PH.list.map(p=>[p.id,p]));
const LESSONS=PH.lessons||[];
const QUIZ_PASS=0.8, PRON_N=5, PRON_PASS=3, PRON_TRIES=3;
S.learn={lang:'de',lesson:null,mode:'study',quiz:null,pron:null};
const learnLangs=()=>Object.keys(PH.langs).filter(k=>!(LANG==='en'&&k==='en'));
const meaningOf=p=>LANG==='en'?p.en:p.ko;
const langName=k=>{ const l=PH.langs[k]||{}; return LANG==='en'?l.nameEn:l.name; };
const langWhere=k=>{ const l=PH.langs[k]||{}; return LANG==='en'?l.whereEn:l.where; };

const lessonPhrases=(l,lg)=>l.ids.map(i=>PHMAP[i]).filter(p=>p&&(!p.only||p.only===lg));
const testable=(l,lg)=>lessonPhrases(l,lg).filter(p=>!/○○|…/.test(p[lg]));

// 학습 기록: 단원은 서버(내 정보)와 이 휴대폰에, 지도자는 이 휴대폰에만 저장
function progress(){
  if(S.anon&&S.me){ if(!S.me.learn||typeof S.me.learn!=='object') S.me.learn={}; return S.me.learn; }
  if(!S.learnLocal){ try{ S.learnLocal=JSON.parse(store.get('learnProg')||'{}'); }catch(e){ S.learnLocal={}; } }
  return S.learnLocal;
}
const langProg=lg=>{ const p=progress(); p[lg]=p[lg]||{passed:[],quiz:{},pron:{},learned:[]}; ['passed','learned'].forEach(k=>{ if(!Array.isArray(p[lg][k])) p[lg][k]=[]; }); ['quiz','pron'].forEach(k=>{ if(!p[lg][k]||typeof p[lg][k]!=='object') p[lg][k]={}; }); return p[lg]; };
let syncT;
function saveProgress(){
  if(S.anon&&S.me){ clearTimeout(syncT); syncT=setTimeout(()=>{ S.sb.rpc('tour_set_learn',{p_token:S.token,p_learn:S.me.learn}).then(r=>{ if(r.error) console.warn(r.error); }); },600); }
  else store.set('learnProg',JSON.stringify(S.learnLocal||{}));
}
const isPassed=(lg,lid)=>langProg(lg).passed.includes(lid);
const isOpen=(lg,i)=>!S.anon||i===0||isPassed(lg,LESSONS[i-1].id); // 지도자는 모든 레슨을 미리 볼 수 있음
function checkPass(lg,l){
  const pr=langProg(lg), n=Math.min(8,testable(l,lg).length);
  const quizOk=(pr.quiz[l.id]||0)>=Math.ceil(n*QUIZ_PASS), pronOk=(pr.pron[l.id]||0)>=PRON_PASS;
  if(quizOk&&pronOk&&!pr.passed.includes(l.id)){ pr.passed.push(l.id); saveProgress(); toast(T('레슨 통과! 다음 레슨이 열렸습니다')); }
}

function sayLang(text,lg,rate){
  if(!('speechSynthesis' in window)){ toast(T('이 휴대폰은 읽어 주기를 지원하지 않습니다')); return; }
  stopSpeak();
  const code=(PH.langs[lg]||{}).speech||'en-US';
  const clean=String(text).replace(/\((a|á)\)/g,'').replace(/\([^)]*\)/g,'').replace(/…/g,'').replace(/\s*\/\s*/g,', ');
  const u=new SpeechSynthesisUtterance(clean); u.lang=code; u.rate=rate||0.9;
  const v=speechSynthesis.getVoices().find(x=>x.lang&&x.lang.replace('_','-').toLowerCase().startsWith(code.slice(0,2).toLowerCase()));
  if(v) u.voice=v; else if(lg==='cs') toast(T('이 휴대폰에 체코어 목소리가 없어 다른 목소리로 읽을 수 있습니다. 한글 발음을 함께 보세요'));
  speechSynthesis.speak(u);
}

// 발음 비교: 악센트·문장부호를 빼고 글자 차이로 닮은 정도(0~1)
const normTxt=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ß/g,'ss').replace(/\([^)]*\)/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
function lev(a,b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; } return prev[n]; }
function similar(heard,target){
  const h=normTxt(heard); if(!h) return 0;
  const options=[target].concat(String(target).split('/')).map(normTxt).filter(Boolean);
  return Math.max(...options.map(t=>1-lev(h,t)/Math.max(h.length,t.length)));
}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function listenOnce(lg){ return new Promise((res,rej)=>{
  const r=new SR(); r.lang=(PH.langs[lg]||{}).speech||'en-US'; r.interimResults=false; r.maxAlternatives=5;
  let done=false; const fin=(v,e)=>{ if(done) return; done=true; try{ r.stop(); }catch(x){} e?rej(e):res(v); };
  r.onresult=ev=>{ const alts=[]; for(const a of ev.results[0]) alts.push(a.transcript); fin(alts); };
  r.onerror=ev=>fin(null,ev.error||'error'); r.onend=()=>fin([]);
  setTimeout(()=>fin(null,'timeout'),9000);
  try{ r.start(); }catch(e){ fin(null,'start'); }
}); }

function startQuiz(mode,l){
  const lg=S.learn.lang, all=testable(l,lg), others=PH.list.filter(p=>!/○○|…/.test(p[lg])&&(!p.only||p.only===lg));
  const shuffle=a=>{ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
  const qs=shuffle(all.slice()).slice(0,8).map(p=>{ const near=shuffle(all.filter(x=>x.id!==p.id)); const far=shuffle(others.filter(x=>x.id!==p.id&&!near.includes(x)));
    return {p,opts:shuffle([p].concat(near.concat(far).slice(0,3)))}; });
  S.learn.quiz={mode,lang:lg,lesson:l.id,qs,i:0,score:0,picked:null};
  if(mode==='listen') setTimeout(()=>sayLang(qs[0].p[lg],lg),300);
}
function startPron(l){
  const lg=S.learn.lang, all=testable(l,lg).slice();
  for(let i=all.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [all[i],all[j]]=[all[j],all[i]]; }
  S.learn.pron={lang:lg,lesson:l.id,items:all.slice(0,PRON_N),i:0,tries:0,ok:0,last:null,busy:false};
}

/* ---------- 휴대폰 알림 ---------- */
const VAPID=(window.TOUR_CONFIG||{}).VAPID_PUBLIC_KEY||'';
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
const pushSupported=()=>!!VAPID&&'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
S.pushOn=false;
function b64u(s){ const pad='='.repeat((4-s.length%4)%4); const b=atob((s+pad).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from([...b].map(c=>c.charCodeAt(0))); }
async function savePushSub(sub){
  const j=sub.toJSON(); const r=await S.sb.rpc('tour_push_subscribe',{p_token:S.token,p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth});
  if(r.error) throw r.error;
}
async function checkPush(){
  if(!S.anon||!pushSupported()||Notification.permission!=='granted'){ S.pushOn=false; return; }
  try{ const reg=await Promise.race([navigator.serviceWorker.ready,new Promise((_,no)=>setTimeout(()=>no(new Error('sw')),4000))]); const sub=await reg.pushManager.getSubscription();
    if(sub){ S.pushOn=true; savePushSub(sub).catch(()=>{}); } else S.pushOn=false; }catch(e){ S.pushOn=false; }
}
async function enablePush(btn){
  if(isIOS&&!standalone()){ toast(T('아이폰은 먼저 홈 화면에 설치한 뒤, 설치한 앱에서 알림을 켜 주세요')); return; }
  if(!pushSupported()){ toast(T('이 휴대폰 브라우저는 알림을 지원하지 않습니다')); return; }

  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){ toast(T('알림이 꺼져 있습니다. 휴대폰 설정에서 이 앱 알림을 허용해 주세요')); return; }
    const reg=await Promise.race([navigator.serviceWorker.ready,new Promise((_,no)=>setTimeout(()=>no(new Error('sw')),8000))]);
    const sub=(await reg.pushManager.getSubscription())||(await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID)}));
    await savePushSub(sub); S.pushOn=true; toast(T('알림을 켰습니다. 공지가 오면 휴대폰이 울립니다'));
  }catch(e){ toast(T('알림을 켜지 못했습니다. 다시 눌러 주세요')); }
  finally{ if(btn){ btn.disabled=false; } render(); }
}
function pushCard(){
  if(!S.anon||S.pushOn||!VAPID) return null;
  const b=h('button',{class:'btn btn-red',type:'button',style:'min-height:44px'},T('알림 켜기'));
  b.onclick=()=>enablePush(b);
  return h('div',{class:'banner',style:'background:var(--soft)'},h('span',{text:isIOS&&!standalone()?T('아이폰은 홈 화면에 설치해야 알림을 받을 수 있습니다. 위의 설치 안내를 따라 주세요.'):T('알림을 켜면 앱을 닫아도 공지·인원 점검·해설이 오면 휴대폰이 울립니다.')}),b);

    h('div',{class:'actions'},copy,share||h('span'))));
  const name=h('input',{class:'in',placeholder:T('휴대폰 없는 단원 이름')}), grp=h('select',{class:'in'},GROUPS.map(x=>h('option',{value:x},T(x))));
  const add=h('button',{class:'btn btn-ghost',type:'button'},T('직접 추가'));
  add.onclick=async()=>{ if(!name.value.trim()){ toast(T('이름을 넣어 주세요')); return; } const r=await S.sb.from('tour_members').insert({tour_id:S.tour.id,name:name.value.trim().slice(0,30),grp:grp.value,token:null}); if(r.error) toast(errText(r.error)); else { name.value=''; toast(T('단원을 추가했습니다')); reloadSoon('members'); } };
  const mem=[...S.members].sort((a,b)=>a.name.localeCompare(b.name,'ko'));
  const pushN=new Set(S.subs.map(x=>x.member_id)).size;
  wrap.append(h('section',{class:'panel'},h('div',{style:'display:flex;justify-content:space-between;align-items:center;gap:8px'},h('h2',{text:T('단원 ')+mem.length+T('명')}),VAPID?h('span',{class:'pill'+(pushN<mem.filter(m=>m.token).length?' warn':''),text:T('알림 켬 ')+pushN+T('명')}):null),
    mem.length? h('div',{class:'list',style:'padding:0;background:none'},mem.map(m=>h('div',{class:'row-item'},
      h('button',{class:'row-body',type:'button',onclick:()=>memberSheet(m)},h('span',{class:'ttl'},m.name+' · '+T(m.grp),m.health?h('span',{class:'tag show',style:'margin-left:6px',text:T('건강 메모')}):null),
        h('span',{class:'muted',text:[m.room?m.room+T('호'):'',m.seat?T('버스 ')+m.seat:'',checklistItems().length&&m.token?T('준비물 ')+packedCount(m)+'/'+checklistItems().length:''].filter(Boolean).join(' · ')||T('눌러서 방·좌석·건강 메모 넣기')}),
        h('span',{class:'muted',text:m.token?(hm(m.joined_at)+T(' 참가')+(m.last_loc_at?T(' · 위치 ')+ago(m.last_loc_at):'')):T('휴대폰 없이 추가')})),
      m.last_lat!=null?h('a',{class:'maplink',href:posUrl(m.last_lat,m.last_lng),target:'_blank',rel:'noopener'},T('위치')):null,
      armButton(h('button',{class:'maplink',type:'button'},T('빼기')),T('뺍니다'),async()=>{ const r=await S.sb.from('tour_members').delete().eq('id',m.id); if(r.error) toast(errText(r.error)); else reloadSoon('members'); }))))
      : h('span',{class:'muted',text:T('아직 참가한 단원이 없습니다.')}),
    h('div',{class:'grid2'},name,grp), add));
  const tn=h('input',{class:'in',value:S.tour.name}), ts=h('input',{class:'in',type:'date',value:S.tour.start_date||''}), te=h('input',{class:'in',type:'date',value:S.tour.end_date||''});
  const sv=h('button',{class:'btn btn-ghost',type:'button'},T('원정 정보 저장'));
  sv.onclick=async()=>{ if(!tn.value.trim()){ toast(T('원정 이름을 넣어 주세요')); return; } if(ts.value&&te.value&&te.value<ts.value){ toast(T('돌아오는 날이 출발일보다 빠릅니다')); return; }
    const r=await S.sb.from('tour_tours').update({name:tn.value.trim(),start_date:ts.value||null,end_date:te.value||null}).eq('id',S.tour.id).select().single();
    if(r.error) toast(errText(r.error)); else { S.tour=r.data; toast(T('저장했습니다')); render(); } };
  { const lp=learnPanel(); if(lp) wrap.append(lp); }
  wrap.append(roomsPanel(), checklistEditor());
  wrap.append(h('section',{class:'panel'},h('h2',{text:T('원정 정보')}),h('label',{class:'f'},T('원정 이름'),tn),h('div',{class:'grid2'},h('label',{class:'f'},T('출발일'),ts),h('label',{class:'f'},T('돌아오는 날'),te)),sv));
  return wrap;
}

/* ---------- 홈 화면 설치 안내 ---------- */
let deferredPrompt=null;
const standalone=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function showInstall(){
  const bar=$('installBar'); if(standalone()||store.get('installHidden')){ bar.hidden=true; return; }
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  const close=h('button',{class:'linkbtn',type:'button',onclick:()=>{ store.set('installHidden','1'); bar.hidden=true; }},T('닫기'));
  if(deferredPrompt) bar.replaceChildren(h('span',{text:T('홈 화면에 설치하면 앱처럼 바로 열립니다.')}),h('button',{class:'btn btn-navy',type:'button',style:'min-height:40px',onclick:async()=>{ deferredPrompt.prompt(); await deferredPrompt.userChoice.catch(()=>{}); deferredPrompt=null; bar.hidden=true; }},T('설치')),close);
  else if(ios) bar.replaceChildren(h('span',{text:T('아래 공유 버튼(네모에 화살표) → 「홈 화면에 추가」를 누르면 앱처럼 설치됩니다.')}),close);
  else { bar.hidden=true; return; }
  bar.hidden=false;
}
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredPrompt=e; showInstall(); });
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

/* ---------- 시작·화면 고르기 ---------- */
async function route(){
  if(!configured){ screenSetup(); return; }
  const {data}=await S.sb.auth.getSession();
  S.session=data.session; S.uid=data.session?data.session.user.id:null;
  const code=new URLSearchParams(location.search).get('code');
  if(!S.session){
    S.token=store.get('tourToken'); S.anon=!!S.token;
    if(S.anon){
      try{ await loadAll(); }catch(e){ return; }
      if(code && S.tour && S.tour.code!==code.toUpperCase()){ S.anon=false; S.tour=null; screenJoin(code); return; }
      history.replaceState(null,'',location.pathname);
      checkPush().then(()=>{ if(S.pushOn) render(); }); S.tab=S.tab||'notices'; S.knownNotices=new Set(S.notices.map(n=>n.id)); { const lg=liveGuide(); S.knownLive=lg?lg.id+lg.live_at:''; if(lg) S.tab='guide'; } render(); return;
    }
    code?screenJoin(code):screenLanding(); return;
  }
  S.anon=false;
  if(code){ history.replaceState(null,'',location.pathname); }
  const want=store.get('tourId');
  if(want){ const r=await S.sb.from('tour_tours').select('*').eq('id',want).eq('owner_id',S.uid).maybeSingle(); if(r.data){ await openTour(r.data); return; } }
  screenTours();
}
if(configured){
  S.sb=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
}
route().catch(err=>main(h('div',{class:'empty'},h('strong',{text:T('열지 못했습니다')}),h('span',{text:errText(err)}))));
showInstall();
})();
</script>
